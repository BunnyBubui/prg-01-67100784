spring.application.name=OrdersSystem
server.port=3000

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/orders}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# กำหนดให้ Hibernate อัปเดตโครงสร้างฐานข้อมูลโดยอัตโนมัติ
spring.jpa.hibernate.ddl-auto=update

# เพิ่มการแสดง SQL logs เพื่อการทดสอบ
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ปิดการใช้ SSL
spring.datasource.hikari.data-source-properties.useSSL=false
